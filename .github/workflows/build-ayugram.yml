name: Build HushTelegram for AyuGram

on:
  workflow_dispatch:
    inputs:
      ayugram_package:
        description: "AyuGram Package Name"
        required: true
        default: "com.radolyn.ayugram"
      ayugram_version:
        description: "Target AyuGram Version (leave blank for ALL versions)"
        required: false
        default: ""

permissions:
  contents: write
  packages: read

jobs:
  build-ayugram-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Forked Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Patch Compatibility for AyuGram & Isolate Forwarding Patch
        shell: python
        env:
          AYU_PKG: ${{ inputs.ayugram_package }}
          AYU_VER: ${{ inputs.ayugram_version }}
        run: |
          import os, re, glob

          ayu_pkg = os.environ.get("AYU_PKG", "com.radolyn.ayugram").strip()
          ayu_ver = os.environ.get("AYU_VER", "").strip()

          print(f"[*] Target Package: {ayu_pkg}")
          print(f"[*] Target Version: {ayu_ver if ayu_ver else 'ALL (Universal)'}")

          compat_files = glob.glob("patches/src/main/kotlin/**/AppCompatibilities.kt", recursive=True)
          for path in compat_files:
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              print(f"[*] Modifying compatibility file: {path}")
              content = content.replace('"org.telegram.messenger.web"', f'"{ayu_pkg}"')

              if ayu_ver:
                  content = content.replace('"13.1.0"', f'"{ayu_ver}"')
                  content = content.replace('"13.1.1"', f'"{ayu_ver}"')
              else:
                  content = re.sub(r'AppTarget\s*\(\s*version\s*=\s*"[^"]+"[^)]*\)', '', content)
                  content = re.sub(r'"13\.1\.[01]"', 'null', content)

              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

          kt_files = glob.glob("patches/src/main/kotlin/**/*.kt", recursive=True)
          keep_enabled_keywords = [
              "Hide sender names when forwarding",
              "HideSender",
              "Forward",
              "HushTelegram settings",
              "SettingsPatch",
              "ExtensionPatch",
              "SharedExtension"
          ]

          for path in kt_files:
              with open(path, "r", encoding="utf-8") as f:
                  text = f.read()

              modified = False
              if '"org.telegram.messenger.web"' in text:
                  text = text.replace('"org.telegram.messenger.web"', f'"{ayu_pkg}"')
                  modified = True

              is_target_patch = any(
                  k.lower() in text.lower() or k.lower() in path.lower()
                  for k in keep_enabled_keywords
              )

              if not is_target_patch:
                  new_text = re.sub(r'use\s*=\s*true', 'use = false', text)
                  if new_text != text:
                      text = new_text
                      modified = True
              else:
                  new_text = re.sub(r'use\s*=\s*false', 'use = true', text)
                  if new_text != text:
                      text = new_text
                      modified = True

              if modified:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(text)

          print("[+] Successfully configured HushTelegram repository for AyuGram.")

      - name: Build Morphe Patch Bundle (.mpp)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:generatePatchesList --no-daemon
          ./gradlew :patches:buildAndroid --no-daemon

      - name: Locate Built .mpp File & Update patches-bundle.json
        id: bundle
        run: |
          MPP_PATH=$(find patches/build -name "*.mpp" | head -n 1)
          if [ -z "$MPP_PATH" ]; then
            echo "Error: .mpp file was not generated!"
            exit 1
          fi
          MPP_FILENAME=$(basename "$MPP_PATH")
          VERSION=$(echo "$MPP_FILENAME" | sed -E 's/patches-(.*)\.mpp//')
          TAG="v${VERSION}-ayugram"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${MPP_FILENAME}"

          echo "mpp_path=$MPP_PATH" >> $GITHUB_OUTPUT
          echo "mpp_filename=$MPP_FILENAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          python3 -c '
          import json, datetime, os
          bundle_data = {
            "created_at": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%S"),
            "description": "Custom HushTelegram build for AyuGram (" + os.environ.get("AYU_PKG", "com.radolyn.ayugram") + ") - Hide sender names when forwarding",
            "download_url": os.environ["DOWNLOAD_URL"],
            "signature_download_url": "",
            "version": os.environ["VERSION"] + "-ayugram"
          }
          with open("patches-bundle.json", "w", encoding="utf-8") as f:
              json.dump(bundle_data, f, indent=2)
          '
        env:
          AYU_PKG: ${{ inputs.ayugram_package }}
          DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/v${{ steps.bundle.outputs.version }}-ayugram/${{ steps.bundle.outputs.mpp_filename }}

      - name: Create GitHub Release with .mpp Bundle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bundle.outputs.tag }}
          name: "HushTelegram for AyuGram (${{ steps.bundle.outputs.tag }})"
          body: "Custom Morphe patch bundle targeting `${{ inputs.ayugram_package }}` with **Hide sender names when forwarding** isolated."
          files: |
            ${{ steps.bundle.outputs.mpp_path }}
            patches-list.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Updated patches-bundle.json to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json patches-list.json
          git commit -m "chore(ayugram): point Morphe Manager to ${{ steps.bundle.outputs.tag }} bundle" || true
          git push
