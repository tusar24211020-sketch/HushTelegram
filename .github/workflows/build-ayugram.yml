name: Build HushTelegram for AyuGram

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      ayugram_package:
        description: "AyuGram Package Name"
        required: true
        default: "com.radolyn.ayugram"
      ayugram_version:
        description: "Target AyuGram Version"
        required: false
        default: ""

permissions:
  contents: write
  packages: read

jobs:
  build-ayugram-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Forked Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Configure GitHub Packages Auth & Patch AyuGram Compatibility
        shell: python
        env:
          AYU_PKG: ${{ inputs.ayugram_package || 'com.radolyn.ayugram' }}
          AYU_VER: ${{ inputs.ayugram_version || '' }}
          GH_USER: ${{ github.actor }}
          GH_PAT: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          import os, re, glob, pathlib

          gh_user = os.environ.get("GH_USER", "").strip()
          gh_pat = os.environ.get("GH_PAT", "").strip()

          if not gh_pat:
              raise SystemExit(
                  "\n[!] ERROR: 'GH_PACKAGES_TOKEN' secret পাওয়া যায়নি!\n"
                  "অনুগ্রহ করে আপনার রিপোজিটরির Settings -> Secrets and variables -> Actions-এ গিয়ে "
                  "'GH_PACKAGES_TOKEN' নামে একটি Classic Personal Access Token (যাতে 'read:packages' টিক দেওয়া আছে) যোগ করুন।"
              )

          gradle_home = pathlib.Path.home() / ".gradle"
          gradle_home.mkdir(parents=True, exist_ok=True)
          creds_block = f"\ngpr.user={gh_user}\ngpr.key={gh_pat}\n"

          for prop_path in [gradle_home / "gradle.properties", pathlib.Path("gradle.properties")]:
              existing = prop_path.read_text(encoding="utf-8") if prop_path.exists() else ""
              prop_path.write_text(existing + creds_block, encoding="utf-8")

          # Disable Gradle dependency verification at the source: Gradle only enforces
          # verification if gradle/verification-metadata.xml exists, so removing it
          # (plus --dependency-verification=off in the build step) prevents failures
          # like a junit-bom checksum mismatch without relying on any undocumented flag.
          for meta_path in glob.glob("**/gradle/verification-metadata.xml", recursive=True):
              try:
                  os.remove(meta_path)
                  print(f"[*] Removed {meta_path} to prevent verification failures")
              except OSError as e:
                  print(f"[!] Could not remove {meta_path}: {e}")

          ayu_pkg = os.environ.get("AYU_PKG", "com.radolyn.ayugram").strip() or "com.radolyn.ayugram"
          ayu_ver = os.environ.get("AYU_VER", "").strip()

          print(f"[*] Target Package: {ayu_pkg}")
          print(f"[*] Target Version: {ayu_ver if ayu_ver else 'ALL (Universal)'}")

          compat_files = glob.glob("patches/src/main/kotlin/**/AppCompatibilities.kt", recursive=True)
          for path in compat_files:
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              content = content.replace('"org.telegram.messenger.web"', f'"{ayu_pkg}"')

              if ayu_ver:
                  content = content.replace('"13.1.0"', f'"{ayu_ver}"')
                  content = content.replace('"13.1.1"', f'"{ayu_ver}"')
              else:
                  # Strip AppTarget(version = "...") calls entirely so matching becomes
                  # version-agnostic.
                  content = re.sub(r'AppTarget\s*\(\s*version\s*=\s*"[^"]+"[^)]*\)', '', content)

                  # Any remaining "13.1.0"/"13.1.1" literals get nulled out — but a bare
                  # `null` is NOT a valid const val (Kotlin: TYPE_CANT_BE_USED_FOR_CONST_VAL,
                  # "Const 'val' has type 'Nothing?'"). So for const val lines, drop `const`
                  # and widen an explicit String type to String? before nulling.
                  new_lines = []
                  for line in content.split('\n'):
                      if re.search(r'"13\.1\.[01]"', line):
                          if re.search(r'\bconst\s+val\b', line):
                              line = re.sub(r'\bconst\s+val\b', 'val', line)
                              line = re.sub(r':\s*String\b(?!\?)', ': String?', line)
                              line = re.sub(r'"13\.1\.[01]"', 'null', line)
                          else:
                              line = re.sub(r'"13\.1\.[01]"', 'null', line)
                      new_lines.append(line)
                  content = '\n'.join(new_lines)

              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

          kt_files = glob.glob("patches/src/main/kotlin/**/*.kt", recursive=True)
          keep_enabled_keywords = [
              "Hide sender names when forwarding",
              "HideSender",
              "Forward",
              "HushTelegram settings",
              "SettingsPatch",
              "ExtensionPatch",
              "SharedExtension"
          ]

          for path in kt_files:
              with open(path, "r", encoding="utf-8") as f:
                  text = f.read()

              modified = False
              if '"org.telegram.messenger.web"' in text:
                  text = text.replace('"org.telegram.messenger.web"', f'"{ayu_pkg}"')
                  modified = True

              is_target_patch = any(
                  k.lower() in text.lower() or k.lower() in path.lower()
                  for k in keep_enabled_keywords
              )

              if not is_target_patch:
                  new_text = re.sub(r'\buse\s*=\s*true\b', 'use = false', text)
                  if new_text != text:
                      text = new_text
                      modified = True
              else:
                  new_text = re.sub(r'\buse\s*=\s*false\b', 'use = true', text)
                  if new_text != text:
                      text = new_text
                      modified = True

              if modified:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(text)

          print("[+] Successfully configured auth and AyuGram patch compatibility.")

      - name: Build Morphe Patch Bundle (.mpp)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GPR_USER: ${{ github.actor }}
          GPR_KEY: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:generatePatchesList --no-daemon --dependency-verification=off
          ./gradlew :patches:buildAndroid --no-daemon --dependency-verification=off

      - name: Locate Built .mpp File & Update patches-bundle.json
        id: bundle
        shell: python
        env:
          REPO: ${{ github.repository }}
          AYU_PKG: ${{ inputs.ayugram_package || 'com.radolyn.ayugram' }}
        run: |
          import os, glob, re, json, datetime

          mpp_files = glob.glob("patches/build/**/*.mpp", recursive=True)
          if not mpp_files:
              raise SystemExit("Error: .mpp file was not generated!")

          mpp_path = mpp_files[0]
          mpp_filename = os.path.basename(mpp_path)
          m = re.match(r"patches-(.*)\.mpp", mpp_filename)
          version = m.group(1) if m else "0.0.23"
          tag = f"v{version}-ayugram"
          repo = os.environ["REPO"]
          ayu_pkg = os.environ.get("AYU_PKG", "com.radolyn.ayugram").strip() or "com.radolyn.ayugram"
          download_url = f"https://github.com/{repo}/releases/download/{tag}/{mpp_filename}"

          gh_out = os.environ["GITHUB_OUTPUT"]
          with open(gh_out, "a", encoding="utf-8") as out:
              out.write(f"mpp_path={mpp_path}\n")
              out.write(f"mpp_filename={mpp_filename}\n")
              out.write(f"version={version}\n")
              out.write(f"tag={tag}\n")

          bundle_data = {
              "created_at": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%S"),
              "description": f"Custom HushTelegram build for AyuGram ({ayu_pkg}) - Hide sender names when forwarding",
              "download_url": download_url,
              "signature_download_url": "",
              "version": f"{version}-ayugram"
          }
          with open("patches-bundle.json", "w", encoding="utf-8") as f:
              json.dump(bundle_data, f, indent=2)

      - name: Create GitHub Release with .mpp Bundle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bundle.outputs.tag }}
          name: "HushTelegram for AyuGram (${{ steps.bundle.outputs.tag }})"
          body: "Custom Morphe patch bundle targeting AyuGram with **Hide sender names when forwarding** isolated."
          files: |
            ${{ steps.bundle.outputs.mpp_path }}
            patches-list.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Updated patches-bundle.json to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          FILES_TO_ADD=""
          [ -f patches-bundle.json ] && FILES_TO_ADD="$FILES_TO_ADD patches-bundle.json"
          [ -f patches-list.json ] && FILES_TO_ADD="$FILES_TO_ADD patches-list.json"
          if [ -n "$FILES_TO_ADD" ]; then
            git add $FILES_TO_ADD
            git commit -m "chore(ayugram): point Morphe Manager to ${{ steps.bundle.outputs.tag }} bundle [skip ci]" || true
            git push
          else
            echo "[!] No bundle files found to commit — skipping commit/push."
          fi
