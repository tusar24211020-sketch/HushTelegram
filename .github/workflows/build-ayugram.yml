name: Build HushTelegram for AyuGram

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      ayugram_package:
        description: "AyuGram Package Name"
        required: true
        default: "com.radolyn.ayugram"
      ayugram_version:
        description: "Target AyuGram Version (leave empty to keep 13.1.1)"
        required: false
        default: ""

permissions:
  contents: write
  packages: read

concurrency:
  group: build-ayugram-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ayugram-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Forked Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Configure GitHub Packages Auth & Patch AyuGram Compatibility
        shell: python
        env:
          AYU_PKG: ${{ inputs.ayugram_package || 'com.radolyn.ayugram' }}
          AYU_VER: ${{ inputs.ayugram_version || '' }}
          GH_USER: ${{ github.actor }}
          GH_PAT: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          import os, re, glob, pathlib

          gh_user = os.environ.get("GH_USER", "").strip()
          gh_pat = os.environ.get("GH_PAT", "").strip()

          if not gh_pat:
              raise SystemExit(
                  "\n[!] ERROR: 'GH_PACKAGES_TOKEN' secret পাওয়া যায়নি!\n"
                  "অনুগ্রহ করে আপনার রিপোজিটরির Settings -> Secrets and variables -> Actions-এ গিয়ে "
                  "'GH_PACKAGES_TOKEN' নামে একটি Classic Personal Access Token (যাতে 'read:packages' টিক দেওয়া আছে) যোগ করুন।"
              )

          # ---- 1. GitHub Packages credentials for Gradle -------------------------------
          gradle_home = pathlib.Path.home() / ".gradle"
          gradle_home.mkdir(parents=True, exist_ok=True)
          creds_block = f"\ngpr.user={gh_user}\ngpr.key={gh_pat}\n"
          for prop_path in [gradle_home / "gradle.properties", pathlib.Path("gradle.properties")]:
              existing = prop_path.read_text(encoding="utf-8") if prop_path.exists() else ""
              prop_path.write_text(existing + creds_block, encoding="utf-8")

          # ---- 2. Stale dependency verification metadata (junit-bom checksum mismatch) --
          for meta_path in glob.glob("**/gradle/verification-metadata.xml", recursive=True):
              try:
                  os.remove(meta_path)
                  print(f"[*] Removed {meta_path}")
              except OSError as e:
                  print(f"[!] Could not remove {meta_path}: {e}")

          ayu_pkg = os.environ.get("AYU_PKG", "com.radolyn.ayugram").strip() or "com.radolyn.ayugram"
          ayu_ver = os.environ.get("AYU_VER", "").strip()
          print(f"[*] Target Package: {ayu_pkg}")
          print(f"[*] Target Version: {ayu_ver if ayu_ver else 'upstream default (13.1.1), unchanged'}")

          def rewrite(path, transform):
              """Read a file, apply transform, write back. Fails loudly if the file is missing."""
              if not os.path.isfile(path):
                  raise SystemExit(f"[!] Expected file not found: {path} (patch source layout changed)")
              with open(path, "r", encoding="utf-8") as f:
                  old = f.read()
              new = transform(old)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(new)

          # ---- 3. Compatibility: let Morphe Manager offer the patches for AyuGram -------
          # Only the telegram.org entry ("org.telegram.messenger.web") is retargeted; that
          # entry already carries version 13.1.1 / code 72379, the same as AyuGram 13.1.1.
          compat_path = "patches/src/main/kotlin/app/morphe/patches/shared/compat/AppCompatibilities.kt"

          def patch_compat(src):
              web = '"org.telegram.messenger.web"'
              if web not in src:
                  raise SystemExit(f"[!] {web} not found in {compat_path}; source changed")
              src = src.replace(web, f'"{ayu_pkg}"')
              # Never null a version: AppTarget throws "Version codes requires declaring a
              # version string". A version is only replaced when explicitly supplied.
              if ayu_ver:
                  src = src.replace('"13.1.0"', f'"{ayu_ver}"').replace('"13.1.1"', f'"{ayu_ver}"')
              return src

          rewrite(compat_path, patch_compat)
          print(f"[+] Compatibility now targets {ayu_pkg}")

          # ---- 4. Application class --------------------------------------------------
          # Official Telegram's Application class is ApplicationLoaderImpl. AyuGram's is
          # org.telegram.messenger.ApplicationLoader (no "Impl") and it declares onCreate().
          # Verified against the AyuGram 13.1.1 APK: manifest + dex.
          ext_path = "patches/src/main/kotlin/app/morphe/patches/telegram/misc/extension/TelegramExtensionPatch.kt"
          old_app = '"Lorg/telegram/messenger/ApplicationLoaderImpl;"'
          new_app = '"Lorg/telegram/messenger/ApplicationLoader;"'

          def patch_app(src):
              if old_app not in src:
                  raise SystemExit(f"[!] {old_app} not found in {ext_path}; source changed")
              return src.replace(old_app, new_app)

          rewrite(ext_path, patch_app)
          print("[+] TELEGRAM_APPLICATION -> org.telegram.messenger.ApplicationLoader")

          # ---- 4b. Native "HushTelegram" row inside Telegram's Settings screen ---------
          # That row is wired by matching Telegram's exact settings-screen bytecode, which
          # AyuGram changes (it throws "native self-settings row builder is missing or
          # ambiguous"). The patch already supports running without it: resolveNativeSettings()
          # returns null and HushTelegram settings stays reachable from the app icon's
          # long-press shortcut and from Android's App info > "Additional settings in the app".
          settings_path = "patches/src/main/kotlin/app/morphe/patches/telegram/misc/settings/SettingsPatch.kt"
          old_gate = "if (candidates.isEmpty() && shells.isEmpty()) return null"
          new_gate = "if ((candidates.isEmpty() && shells.isEmpty()) || classes.isNotEmpty()) return null"

          def patch_native(src):
              if src.count(old_gate) != 1:
                  raise SystemExit(f"[!] expected exactly one '{old_gate}' in {settings_path}; source changed")
              return src.replace(old_gate, new_gate)

          rewrite(settings_path, patch_native)
          print("[+] Native settings row skipped (AyuGram's settings screen differs)")

          # ---- 4c. App name + icon: look like Telegram --------------------------------
          # The icon patch is off by default, expects Telegram's launcher alias, and draws
          # HushTelegram's own badge. For AyuGram: select it by default, use AyuGram's launcher
          # alias, default the app name to "TelegramT", and use Telegram's blue behind the icon
          # (the Telegram-style pictures themselves are generated in the next step).
          icon_path = "patches/src/main/kotlin/app/morphe/patches/telegram/misc/branding/HushTelegramIconPatch.kt"
          icon_edits = [
              ('internal const val ICON_BACKGROUND = "#FF00218A"',
               'internal const val ICON_BACKGROUND = "#FF2AABEE"'),
              ('internal const val DEFAULT_ICON = "org.telegram.messenger.DefaultIcon"',
               'internal const val DEFAULT_ICON = "com.exteragram.messenger.DefaultIcon"'),
              ('key = "appName", default = null, title = "App name",',
               'key = "appName", default = "TelegramT", title = "App name",'),
              ('    default = false,\n) {\n    category("Interface")',
               '    default = true,\n) {\n    category("Interface")'),
          ]

          def patch_icon(src):
              for old, new in icon_edits:
                  if src.count(old) != 1:
                      raise SystemExit(f"[!] expected exactly one {old!r} in {icon_path}; source changed")
                  src = src.replace(old, new)
              return src

          rewrite(icon_path, patch_icon)
          print("[+] Icon patch: on by default, name 'TelegramT', AyuGram launcher alias")

          # ---- 4d. Best-effort mode: a patch that does not fit AyuGram is skipped --------
          # Morphe stops the whole run at the first patch that throws. AyuGram is a fork, so some
          # of the ~67 patches may not find their hook point. Each patch's execute { } block is
          # wrapped so a failure is logged ("Skipped patch <name>: <reason>") and the others
          # still apply. These stay strict, because everything else depends on them or because
          # silently skipping them would hide a problem you asked for: the extension hook, the
          # settings patch, its manifest patch, the icon/name patch and "Hide sender names".
          import re

          def _skip_line_comment(s, i):
              j = s.find("\n", i)
              return len(s) if j < 0 else j + 1

          def _skip_block_comment(s, i):          # Kotlin block comments nest
              depth, n = 0, len(s)
              while i < n:
                  if s.startswith("/*", i): depth += 1; i += 2
                  elif s.startswith("*/", i):
                      depth -= 1; i += 2
                      if depth == 0: return i
                  else: i += 1
              raise ValueError("unterminated block comment")

          def _skip_char(s, i):
              i += 1
              if s[i] == "\\":
                  i += 2
                  while s[i] != "'": i += 1
                  return i + 1
              return i + 2                         # 'x'

          def _skip_string(s, i):
              raw = s.startswith('"""', i)
              i += 3 if raw else 1
              n = len(s)
              while i < n:
                  c = s[i]
                  if raw and s.startswith('"""', i):
                      i += 3
                      while i < n and s[i] == '"': i += 1     # extra quotes belong to the string's end
                      return i
                  if not raw and c == '"': return i + 1
                  if not raw and c == "\\": i += 2; continue
                  if c == "$" and s.startswith("${", i):
                      i = scan(s, i + 2, True) + 1
                      continue
                  i += 1
              raise ValueError("unterminated string")

          def scan(s, i, stop_on_close):
              """Walk Kotlin code from i. With stop_on_close, return the index of the unmatched '}'.
              Otherwise return len(s) and raise if braces do not balance."""
              depth, n = 0, len(s)
              while i < n:
                  c = s[i]
                  if c == "/" and s.startswith("//", i): i = _skip_line_comment(s, i)
                  elif c == "/" and s.startswith("/*", i): i = _skip_block_comment(s, i)
                  elif c == '"': i = _skip_string(s, i)
                  elif c == "'": i = _skip_char(s, i)
                  elif c == "{": depth += 1; i += 1
                  elif c == "}":
                      if depth == 0:
                          if stop_on_close: return i
                          raise ValueError("unbalanced }")
                      depth -= 1; i += 1
                  else: i += 1
              if stop_on_close or depth: raise ValueError("unbalanced {")
              return n

          def code_positions(s, pattern):
              """Matches of regex `pattern` that sit in real code (not comments or strings)."""
              rx, out, i, n = re.compile(pattern), [], 0, len(s)
              while i < n:
                  c = s[i]
                  if c == "/" and s.startswith("//", i): i = _skip_line_comment(s, i); continue
                  if c == "/" and s.startswith("/*", i): i = _skip_block_comment(s, i); continue
                  if c == '"': i = _skip_string(s, i); continue
                  if c == "'": i = _skip_char(s, i); continue
                  m = rx.match(s, i)
                  if m: out.append(m); i = m.end(); continue
                  i += 1
              return out

          PATCH_DECL = re.compile(r'(?:val|fun)\s+(\w+)\b[^{};]*?=\s*(?:bytecodePatch|resourcePatch|rawResourcePatch)\b')
          EXECUTE = r'(?<![\w.@])execute\s*\{'

          def wrap_executes(src, label, fatal):
              """Wrap each patch's `execute { ... }` so a failure is logged and skipped, not fatal."""
              decls = [(m.start(), m.group(1)) for m in PATCH_DECL.finditer(src)]
              found = code_positions(src, EXECUTE)
              edits, wrapped, kept = [], 0, 0
              for m in found:
                  owner = None
                  for pos, name in decls:
                      if pos < m.start(): owner = name
                  if owner in fatal: kept += 1; continue
                  open_i = m.end() - 1
                  close_i = scan(src, open_i + 1, True)
                  who = (owner or label)
                  head = ("{\n        try {\n")
                  tail = ("\n        } catch (hushSkipped: Exception) {\n"
                          f"            java.util.logging.Logger.getLogger(\"HushTelegram\").warning(\n"
                          f"                \"Skipped patch {who}: \" + (hushSkipped.message ?: hushSkipped.toString()))\n"
                          "        }\n        Unit\n    }")
                  edits.append((open_i, close_i, head, tail)); wrapped += 1
              for open_i, close_i, head, tail in sorted(edits, reverse=True):
                  src = src[:open_i] + head + src[open_i + 1:close_i] + tail + src[close_i + 1:]
              return src, wrapped, kept


          STRICT = {"telegramExtensionPatch", "settingsPatch", "settingsManifestPatch",
                    "hushTelegramIconPatch", "forwardHideSenderPatch"}
          wrapped_total = strict_total = 0
          for path in glob.glob("patches/src/main/kotlin/app/morphe/patches/telegram/**/*.kt", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  original = f.read()
              if not code_positions(original, EXECUTE):
                  continue
              new_src, wrapped, strict = wrap_executes(original, os.path.basename(path)[:-3], STRICT)
              scan(new_src, 0, False)  # braces must still balance, or fail now rather than in Gradle
              if wrapped:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(new_src)
              wrapped_total += wrapped
              strict_total += strict
          if wrapped_total < 40:
              raise SystemExit(f"[!] only {wrapped_total} patches wrapped; the patch source layout changed")
          print(f"[+] Best-effort mode: {wrapped_total} patches can be skipped, {strict_total} stay strict")

          # ---- 5. Final sanity check --------------------------------------------------
          with open(compat_path, encoding="utf-8") as f:
              assert f'"{ayu_pkg}"' in f.read(), "compat package rewrite missing"
          with open(ext_path, encoding="utf-8") as f:
              assert new_app in f.read(), "application class rewrite missing"
          with open(settings_path, encoding="utf-8") as f:
              assert new_gate in f.read(), "native row skip missing"
          with open(icon_path, encoding="utf-8") as f:
              assert "com.exteragram.messenger.DefaultIcon" in f.read(), "icon alias rewrite missing"

          print("[+] Successfully configured auth and AyuGram patch compatibility.")

      - name: Generate Telegram Web-style launcher icon
        shell: python
        run: |
          import os, subprocess, sys

          try:
              from PIL import Image, ImageDraw, ImageFilter, ImageOps, ImageChops
          except ImportError:
              for extra in ([], ["--break-system-packages"]):
                  if subprocess.call([sys.executable, "-m", "pip", "install", "--quiet", "pillow", *extra]) == 0:
                      break
              from PIL import Image, ImageDraw, ImageFilter, ImageOps, ImageChops

          OUT = "patches/src/main/resources/hushtelegram/icon"
          if not os.path.isdir(OUT):
              raise SystemExit(f"[!] {OUT} not found; the icon patch layout changed")

          SS = 4
          TOP, BOTTOM = (0x4F, 0xC3, 0xF7), (0x1A, 0x8C, 0xD0)
          PLANE_LEFT = [(0.215, 0.490), (0.785, 0.265), (0.455, 0.620)]
          PLANE_RIGHT = [(0.455, 0.620), (0.785, 0.265), (0.675, 0.745)]
          FLAP = [(0.455, 0.620), (0.500, 0.800), (0.575, 0.685)]
          C_LEFT, C_RIGHT, C_FLAP = (255, 255, 255, 255), (0xE4, 0xEF, 0xF8, 255), (0xB9, 0xCF, 0xE3, 255)

          def pts(shape, x0, w):
              return [(x0 + px * w, x0 + py * w) for px, py in shape]

          def plane(big, frac, with_shadow):
              """Paper plane on a transparent big x big canvas."""
              w = big * frac
              x0 = (big - w) / 2
              out = Image.new("RGBA", (big, big), (0, 0, 0, 0))
              if with_shadow:
                  sh = Image.new("RGBA", (big, big), (0, 0, 0, 0))
                  d = ImageDraw.Draw(sh)
                  dy = w * 0.022
                  for shape in (PLANE_LEFT, PLANE_RIGHT, FLAP):
                      d.polygon([(x, y + dy) for x, y in pts(shape, x0, w)], fill=(0, 40, 90, 120))
                  out.alpha_composite(sh.filter(ImageFilter.GaussianBlur(w * 0.025)))
              d = ImageDraw.Draw(out)
              d.polygon(pts(FLAP, x0, w), fill=C_FLAP)
              d.polygon(pts(PLANE_RIGHT, x0, w), fill=C_RIGHT)
              d.polygon(pts(PLANE_LEFT, x0, w), fill=C_LEFT)
              return out

          def background(big):
              grad = Image.linear_gradient("L").resize((big, big), Image.BILINEAR)
              bg = ImageOps.colorize(grad, black=TOP, white=BOTTOM).convert("RGBA")
              # soft glossy highlight over the upper part, fading out by the middle
              fade = ImageOps.invert(grad).point(lambda v: max(0, v - 128) * 2 * 40 // 255)
              gloss = Image.new("RGBA", (big, big), (255, 255, 255, 0))
              gloss.putalpha(fade)
              bg.alpha_composite(gloss)
              return bg

          def circle_mask(big):
              m = Image.new("L", (big, big), 0)
              ImageDraw.Draw(m).ellipse((0, 0, big - 1, big - 1), fill=255)
              return m

          def badge(size):
              """Round glossy badge (legacy launchers)."""
              big = size * SS
              im = background(big)
              im.alpha_composite(plane(big, 0.98, True))
              d = ImageDraw.Draw(im)
              rim = big * 0.012
              ring = Image.new("L", (big, big), 0)
              ImageDraw.Draw(ring).ellipse((rim, rim, big - 1 - rim, big - 1 - rim), outline=255, width=max(1, round(rim)))
              ring = ring.point(lambda v: v * 70 // 255)
              white = Image.new("RGBA", (big, big), (255, 255, 255, 0)); white.putalpha(ring)
              im.alpha_composite(white)
              im.putalpha(ImageChops.multiply(im.getchannel("A"), circle_mask(big)))
              return im.resize((size, size), Image.LANCZOS)

          def adaptive_foreground(size):
              """Full-bleed gradient + plane, so the launcher's own mask shapes it."""
              big = size * SS
              im = background(big)
              im.alpha_composite(plane(big, 0.667, True))
              return im.resize((size, size), Image.LANCZOS)

          def adaptive_mono(size):
              big = size * SS
              p = plane(big, 0.667, False)
              a = p.getchannel("A").point(lambda v: 255 if v > 0 else 0)
              out = Image.new("RGBA", (big, big), (0, 0, 0, 0)); out.putalpha(a)
              return out.resize((size, size), Image.LANCZOS)

          # Pixel size per density: legacy icon = 48dp, adaptive layers = 108dp.
          DENSITIES = {"mdpi": 1.0, "hdpi": 1.5, "xhdpi": 2.0, "xxhdpi": 3.0, "xxxhdpi": 4.0}
          for density, scale in DENSITIES.items():
              folder = os.path.join(OUT, f"mipmap-{density}")
              os.makedirs(folder, exist_ok=True)
              legacy = round(48 * scale)
              canvas = Image.new("RGBA", (legacy, legacy), (0, 0, 0, 0))
              inner = badge(round(legacy * 44 / 48))
              canvas.alpha_composite(inner, ((legacy - inner.width) // 2, (legacy - inner.height) // 2))
              canvas.save(os.path.join(folder, "hush_launcher.png"))
              layer = round(108 * scale)
              adaptive_foreground(layer).save(os.path.join(folder, "hush_launcher_foreground.png"))
              adaptive_mono(layer).save(os.path.join(folder, "hush_launcher_monochrome.png"))
          print("[+] Telegram Web-style launcher icon generated for", ", ".join(DENSITIES))

      - name: Build Morphe Patch Bundle (.mpp)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GPR_USER: ${{ github.actor }}
          GPR_KEY: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:generatePatchesList --no-daemon --dependency-verification=off
          ./gradlew :patches:buildAndroid --no-daemon --dependency-verification=off

      - name: Locate Built .mpp File & Update patches-bundle.json
        id: bundle
        shell: python
        env:
          REPO: ${{ github.repository }}
          AYU_PKG: ${{ inputs.ayugram_package || 'com.radolyn.ayugram' }}
        run: |
          import os, glob, re, json, datetime

          mpp_files = sorted(glob.glob("patches/build/**/*.mpp", recursive=True))
          if not mpp_files:
              raise SystemExit("Error: .mpp file was not generated!")

          mpp_path = mpp_files[0]
          mpp_filename = os.path.basename(mpp_path)
          m = re.match(r"patches-(.+)\.mpp$", mpp_filename)
          if not m:
              raise SystemExit(f"Error: cannot read the version from '{mpp_filename}'")
          version = m.group(1)
          tag = f"v{version}-ayugram"
          repo = os.environ["REPO"]
          ayu_pkg = os.environ.get("AYU_PKG", "com.radolyn.ayugram").strip() or "com.radolyn.ayugram"
          download_url = f"https://github.com/{repo}/releases/download/{tag}/{mpp_filename}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"mpp_path={mpp_path}\n")
              out.write(f"mpp_filename={mpp_filename}\n")
              out.write(f"version={version}\n")
              out.write(f"tag={tag}\n")

          bundle_data = {
              "created_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S"),
              "description": f"Custom HushTelegram build for AyuGram ({ayu_pkg}) - Hide sender names when forwarding",
              "download_url": download_url,
              "signature_download_url": "",
              "version": f"{version}-ayugram"
          }
          with open("patches-bundle.json", "w", encoding="utf-8") as f:
              json.dump(bundle_data, f, indent=2)
          print(f"[+] Bundle {mpp_filename} -> {tag}")

      - name: Create GitHub Release with .mpp Bundle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bundle.outputs.tag }}
          name: "HushTelegram for AyuGram (${{ steps.bundle.outputs.tag }})"
          body: "Custom Morphe patch bundle targeting AyuGram with **Hide sender names when forwarding**."
          files: |
            ${{ steps.bundle.outputs.mpp_path }}
            patches-list.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Updated patches-bundle.json to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          FILES_TO_ADD=""
          [ -f patches-bundle.json ] && FILES_TO_ADD="$FILES_TO_ADD patches-bundle.json"
          [ -f patches-list.json ] && FILES_TO_ADD="$FILES_TO_ADD patches-list.json"
          if [ -n "$FILES_TO_ADD" ]; then
            git add $FILES_TO_ADD
            git commit -m "chore(ayugram): point Morphe Manager to ${{ steps.bundle.outputs.tag }} bundle [skip ci]" || true
            git push
          else
            echo "[!] No bundle files found to commit — skipping commit/push."
          fi
