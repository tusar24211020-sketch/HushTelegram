name: Build HushTelegram for AyuGram

on:
  workflow_dispatch:
    inputs:
      ayugram_package:
        description: "AyuGram Package Name"
        required: true
        default: "com.radolyn.ayugram"
      ayugram_version:
        description: "Target AyuGram Version (leave blank for ALL versions)"
        required: false
        default: ""

permissions:
  contents: write
  packages: read

jobs:
  build-ayugram-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Forked Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Patch Compatibility for AyuGram & Isolate Forwarding Patch
        env:
          AYU_PKG: ${{ inputs.ayugram_package }}
          AYU_VER: ${{ inputs.ayugram_version }}
        run: |
          python3 - << 'EOF'
          import os, re, glob

          ayu_pkg = os.environ.get("AYU_PKG", "com.radolyn.ayugram").strip()
          ayu_ver = os.environ.get("AYU_VER", "").strip()

          # 1. Unlock AppCompatibilities.kt and any @CompatiblePackage annotations for AyuGram
          compat_files = glob.glob("patches/src/main/kotlin/**/AppCompatibilities.kt", recursive=True)
          for path in compat_files:
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              print(f"Modifying compatibility file: {path}")
              # Replace org.telegram.messenger.web with AyuGram package ID
              content = content.replace('"org.telegram.messenger.web"', f'"{ayu_pkg}"')

              # If user left ayugram_version blank, strip version locks (targets = setOf(...) / AppTarget)
              # so Morphe Manager allows patching any version of AyuGram APK
              if ayu_ver:
                  content = content.replace('"13.1.0"', f'"{ayu_ver}"')
                  content = content.replace('"13.1.1"', f'"{ayu_ver}"')
              else:
                  # Remove strict version target constraints if present
                  content = re.sub(r'AppTarget\s*\(\s*version\s*=\s*"[^"]+"[^)]*\)', '', content)
                  content = re.sub(r'"13\.1\.[01]"', 'null', content)

              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

          # Also scan all Kotlin files for hardcoded package strings in annotations/fingerprints
          kt_files = glob.glob("patches/src/main/kotlin/**/*.kt", recursive=True)
          for path in kt_files:
              with open(path, "r", encoding="utf-8") as f:
                  text = f.read()

              modified = False
              if '"org.telegram.messenger.web"' in text:
                  text = text.replace('"org.telegram.messenger.web"', f'"{ayu_pkg}"')
                  modified = True

              # 2. Disable all other patches by default EXCEPT:
              #    - "Hide sender names when forwarding"
              #    - "HushTelegram settings" / shared extension & credential helpers
              keep_enabled_keywords = [
                  "Hide sender names when forwarding",
                  "HideSender",
                  "Forward",
                  "HushTelegram settings",
                  "SettingsPatch",
                  "ExtensionPatch",
                  "SharedExtension"
              ]
              is_target_patch = any(k.lower() in text.lower() or k.lower() in path.lower() for k in keep_enabled_keywords)

              if not is_target_patch:
                  # Set default selection off so Morphe Manager only selects your desired patch
                  new_text = re.sub(r'\buse\s*=\s*true\b', 'use = false', text)
                  if new_text != text:
                      text = new_text
                      modified = True
              else:
                  # Ensure the target patch is selected by default
                  new_text = re.sub(r'\buse\s*=\s*false\b', 'use = true', text)
                  if new_text != text:
                      text = new_text
                      modified = True

              if modified:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(text)

          print("Successfully configured repository for AyuGram.")
          EOF

      - name: Build Morphe Patch Bundle (.mpp)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:generatePatchesList --no-daemon
          ./gradlew :patches:buildAndroid --no-daemon

      - name: Locate Built .mpp File & Update patches-bundle.json
        id: bundle
        run: |
          MPP_PATH=$(find patches/build -name "*.mpp" | head -n 1)
          if [ -z "$MPP_PATH" ]; then
            echo "Error: .mpp file was not generated!"
            exit 1
          fi
          MPP_FILENAME=$(basename "$MPP_PATH")
          VERSION=$(echo "$MPP_FILENAME" | sed -E 's/patches-(.*)\.mpp/\1/')
          TAG="v${VERSION}-ayugram"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${MPP_FILENAME}"

          echo "mpp_path=$MPP_PATH" >> $GITHUB_OUTPUT
          echo "mpp_filename=$MPP_FILENAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          python3 - << EOF
          import json, datetime
          bundle_data = {
            "created_at": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%S"),
            "description": "Custom HushTelegram build for AyuGram (${{ inputs.ayugram_package }}) - Hide sender names when forwarding",
            "download_url": "${DOWNLOAD_URL}",
            "signature_download_url": "",
            "version": "${VERSION}-ayugram"
          }
          with open("patches-bundle.json", "w", encoding="utf-8") as f:
              json.dump(bundle_data, f, indent=2)
          EOF

      - name: Create GitHub Release with .mpp Bundle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bundle.outputs.tag }}
          name: "HushTelegram for AyuGram (${{ steps.bundle.outputs.tag }})"
          body: "Custom Morphe patch bundle targeting `${{ inputs.ayugram_package }}` with **Hide sender names when forwarding** isolated."
          files: |
            ${{ steps.bundle.outputs.mpp_path }}
            patches-list.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Updated patches-bundle.json to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json patches-list.json
          git commit -m "chore(ayugram): point Morphe Manager to ${{ steps.bundle.outputs.tag }} bundle" || true
          git push
