name: Build HushTelegram for AyuGram

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      ayugram_package:
        description: "AyuGram Package Name"
        required: true
        default: "com.radolyn.ayugram"
      ayugram_version:
        description: "Target AyuGram Version (leave empty to keep 13.1.1)"
        required: false
        default: ""

permissions:
  contents: write
  packages: read

concurrency:
  group: build-ayugram-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ayugram-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Forked Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Configure GitHub Packages Auth & Patch AyuGram Compatibility
        shell: python
        env:
          AYU_PKG: ${{ inputs.ayugram_package || 'com.radolyn.ayugram' }}
          AYU_VER: ${{ inputs.ayugram_version || '' }}
          GH_USER: ${{ github.actor }}
          GH_PAT: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          import os, re, glob, pathlib

          gh_user = os.environ.get("GH_USER", "").strip()
          gh_pat = os.environ.get("GH_PAT", "").strip()

          if not gh_pat:
              raise SystemExit(
                  "\n[!] ERROR: 'GH_PACKAGES_TOKEN' secret পাওয়া যায়নি!\n"
                  "অনুগ্রহ করে আপনার রিপোজিটরির Settings -> Secrets and variables -> Actions-এ গিয়ে "
                  "'GH_PACKAGES_TOKEN' নামে একটি Classic Personal Access Token (যাতে 'read:packages' টিক দেওয়া আছে) যোগ করুন।"
              )

          # ---- 1. GitHub Packages credentials for Gradle -------------------------------
          gradle_home = pathlib.Path.home() / ".gradle"
          gradle_home.mkdir(parents=True, exist_ok=True)
          creds_block = f"\ngpr.user={gh_user}\ngpr.key={gh_pat}\n"
          for prop_path in [gradle_home / "gradle.properties", pathlib.Path("gradle.properties")]:
              existing = prop_path.read_text(encoding="utf-8") if prop_path.exists() else ""
              prop_path.write_text(existing + creds_block, encoding="utf-8")

          # ---- 2. Stale dependency verification metadata (junit-bom checksum mismatch) --
          for meta_path in glob.glob("**/gradle/verification-metadata.xml", recursive=True):
              try:
                  os.remove(meta_path)
                  print(f"[*] Removed {meta_path}")
              except OSError as e:
                  print(f"[!] Could not remove {meta_path}: {e}")

          ayu_pkg = os.environ.get("AYU_PKG", "com.radolyn.ayugram").strip() or "com.radolyn.ayugram"
          ayu_ver = os.environ.get("AYU_VER", "").strip()
          print(f"[*] Target Package: {ayu_pkg}")
          print(f"[*] Target Version: {ayu_ver if ayu_ver else 'upstream default (13.1.1), unchanged'}")

          def rewrite(path, transform):
              """Read a file, apply transform, write back. Fails loudly if the file is missing."""
              if not os.path.isfile(path):
                  raise SystemExit(f"[!] Expected file not found: {path} (patch source layout changed)")
              with open(path, "r", encoding="utf-8") as f:
                  old = f.read()
              new = transform(old)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(new)

          # ---- 3. Compatibility: let Morphe Manager offer the patches for AyuGram -------
          # Only the telegram.org entry ("org.telegram.messenger.web") is retargeted; that
          # entry already carries version 13.1.1 / code 72379, the same as AyuGram 13.1.1.
          compat_path = "patches/src/main/kotlin/app/morphe/patches/shared/compat/AppCompatibilities.kt"

          def patch_compat(src):
              web = '"org.telegram.messenger.web"'
              if web not in src:
                  raise SystemExit(f"[!] {web} not found in {compat_path}; source changed")
              src = src.replace(web, f'"{ayu_pkg}"')
              # Never null a version: AppTarget throws "Version codes requires declaring a
              # version string". A version is only replaced when explicitly supplied.
              if ayu_ver:
                  src = src.replace('"13.1.0"', f'"{ayu_ver}"').replace('"13.1.1"', f'"{ayu_ver}"')
              return src

          rewrite(compat_path, patch_compat)
          print(f"[+] Compatibility now targets {ayu_pkg}")

          # ---- 4. Application class --------------------------------------------------
          # Official Telegram's Application class is ApplicationLoaderImpl. AyuGram's is
          # org.telegram.messenger.ApplicationLoader (no "Impl") and it declares onCreate().
          # Verified against the AyuGram 13.1.1 APK: manifest + dex.
          ext_path = "patches/src/main/kotlin/app/morphe/patches/telegram/misc/extension/TelegramExtensionPatch.kt"
          old_app = '"Lorg/telegram/messenger/ApplicationLoaderImpl;"'
          new_app = '"Lorg/telegram/messenger/ApplicationLoader;"'

          def patch_app(src):
              if old_app not in src:
                  raise SystemExit(f"[!] {old_app} not found in {ext_path}; source changed")
              return src.replace(old_app, new_app)

          rewrite(ext_path, patch_app)
          print("[+] TELEGRAM_APPLICATION -> org.telegram.messenger.ApplicationLoader")

          # ---- 5. Final sanity check --------------------------------------------------
          with open(compat_path, encoding="utf-8") as f:
              assert f'"{ayu_pkg}"' in f.read(), "compat package rewrite missing"
          with open(ext_path, encoding="utf-8") as f:
              assert new_app in f.read(), "application class rewrite missing"

          print("[+] Successfully configured auth and AyuGram patch compatibility.")

      - name: Build Morphe Patch Bundle (.mpp)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GPR_USER: ${{ github.actor }}
          GPR_KEY: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:generatePatchesList --no-daemon --dependency-verification=off
          ./gradlew :patches:buildAndroid --no-daemon --dependency-verification=off

      - name: Locate Built .mpp File & Update patches-bundle.json
        id: bundle
        shell: python
        env:
          REPO: ${{ github.repository }}
          AYU_PKG: ${{ inputs.ayugram_package || 'com.radolyn.ayugram' }}
        run: |
          import os, glob, re, json, datetime

          mpp_files = sorted(glob.glob("patches/build/**/*.mpp", recursive=True))
          if not mpp_files:
              raise SystemExit("Error: .mpp file was not generated!")

          mpp_path = mpp_files[0]
          mpp_filename = os.path.basename(mpp_path)
          m = re.match(r"patches-(.+)\.mpp$", mpp_filename)
          if not m:
              raise SystemExit(f"Error: cannot read the version from '{mpp_filename}'")
          version = m.group(1)
          tag = f"v{version}-ayugram"
          repo = os.environ["REPO"]
          ayu_pkg = os.environ.get("AYU_PKG", "com.radolyn.ayugram").strip() or "com.radolyn.ayugram"
          download_url = f"https://github.com/{repo}/releases/download/{tag}/{mpp_filename}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"mpp_path={mpp_path}\n")
              out.write(f"mpp_filename={mpp_filename}\n")
              out.write(f"version={version}\n")
              out.write(f"tag={tag}\n")

          bundle_data = {
              "created_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S"),
              "description": f"Custom HushTelegram build for AyuGram ({ayu_pkg}) - Hide sender names when forwarding",
              "download_url": download_url,
              "signature_download_url": "",
              "version": f"{version}-ayugram"
          }
          with open("patches-bundle.json", "w", encoding="utf-8") as f:
              json.dump(bundle_data, f, indent=2)
          print(f"[+] Bundle {mpp_filename} -> {tag}")

      - name: Create GitHub Release with .mpp Bundle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bundle.outputs.tag }}
          name: "HushTelegram for AyuGram (${{ steps.bundle.outputs.tag }})"
          body: "Custom Morphe patch bundle targeting AyuGram with **Hide sender names when forwarding**."
          files: |
            ${{ steps.bundle.outputs.mpp_path }}
            patches-list.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Updated patches-bundle.json to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          FILES_TO_ADD=""
          [ -f patches-bundle.json ] && FILES_TO_ADD="$FILES_TO_ADD patches-bundle.json"
          [ -f patches-list.json ] && FILES_TO_ADD="$FILES_TO_ADD patches-list.json"
          if [ -n "$FILES_TO_ADD" ]; then
            git add $FILES_TO_ADD
            git commit -m "chore(ayugram): point Morphe Manager to ${{ steps.bundle.outputs.tag }} bundle [skip ci]" || true
            git push
          else
            echo "[!] No bundle files found to commit — skipping commit/push."
          fi
